components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 200
        currency:
          type: string
          maxLength: 3
        color:
          type: string
          maxLength: 25
        open_datetime:
          type: string
          format: date-time
        close_datetime:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - currency
      - id
      - name
      - open_datetime
      - updated_at
    Acquisition:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        source:
          type: string
          maxLength: 200
        request_time:
          type: string
          format: date-time
          nullable: true
        obtained_at:
          type: string
          format: date-time
          nullable: true
        remark:
          type: string
        cost_factors:
          type: array
          items:
            $ref: '#/components/schemas/CostFactor'
        net_cost:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: net_cost = per-currency sum of cost-factor values (value carries
            its sign).
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        item_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - item_count
      - net_cost
      - updated_at
    AcquisitionSummary:
      type: object
      description: Compact acquisition representation nested inside an item.
      properties:
        id:
          type: string
          readOnly: true
        source:
          type: string
          maxLength: 200
        request_time:
          type: string
          format: date-time
          nullable: true
        obtained_at:
          type: string
          format: date-time
          nullable: true
        net_cost:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: net_cost = per-currency sum of cost-factor values (value carries
            its sign).
          readOnly: true
      required:
      - id
      - net_cost
    Asset:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - updated_at
    AttributeDefinition:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        content_type:
          type: integer
        content_type_label:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 200
        data_type:
          $ref: '#/components/schemas/DataTypeEnum'
        unit_family:
          oneOf:
          - $ref: '#/components/schemas/UnitFamilyEnum'
          - $ref: '#/components/schemas/BlankEnum'
        emoji:
          type: string
          maxLength: 8
        is_system:
          type: boolean
          readOnly: true
        display_order:
          type: integer
          maximum: 2147483647
          minimum: 0
        options: {}
      required:
      - content_type
      - content_type_label
      - data_type
      - id
      - is_system
      - name
    BalanceSheet:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        date:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - date
      - id
      - updated_at
    BlankEnum:
      enum:
      - ''
    CostFactor:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        value:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,4})?$
        currency:
          type: string
          maxLength: 3
        type:
          type: string
          maxLength: 20
        display_order:
          type: integer
          readOnly: true
        user_managed:
          type: boolean
      required:
      - display_order
      - id
      - value
    Currency:
      type: object
      properties:
        code:
          type: string
          maxLength: 3
        name:
          type: string
          maxLength: 100
        symbol:
          type: string
          maxLength: 10
        is_base_currency:
          type: boolean
      required:
      - code
      - name
    DataTypeEnum:
      enum:
      - text
      - long_text
      - number
      - date
      - boolean
      - single_select
      - dimension
      type: string
      description: |-
        * `text` - Text
        * `long_text` - Long Text
        * `number` - Number
        * `date` - Date
        * `boolean` - Boolean
        * `single_select` - Single Select
        * `dimension` - Dimension
    EntityView:
      type: object
      description: |-
        Saved entity view. ``owner`` is never serialized — it is stamped from the
        request user by the viewset and every queryset is owner-scoped.
      properties:
        id:
          type: string
          readOnly: true
        table_key:
          type: string
          maxLength: 100
        name:
          type: string
          maxLength: 100
        config: {}
        pinned:
          type: boolean
        position:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - table_key
      - updated_at
    ExchangeRate:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        base_currency:
          type: string
          maxLength: 3
        quote_currency:
          type: string
          maxLength: 3
        rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,8})?$
        date:
          type: string
          format: date-time
      required:
      - base_currency
      - date
      - id
      - quote_currency
      - rate
    Item:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 200
        alias_name:
          type: string
          maxLength: 200
        quantity:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        spec:
          type: string
        remark:
          type: string
        sku_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,4})?$
          nullable: true
        sku_price_currency:
          type: string
          maxLength: 3
        total_price:
          type: string
          nullable: true
          readOnly: true
        url:
          type: string
          maxLength: 500
        status:
          type: string
          readOnly: true
        deprecated:
          type: boolean
        deprecate_time:
          type: string
          format: date-time
          nullable: true
        parameters:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: The item's parameter rows (shared attribute values), stable
            order.
          readOnly: true
        acquisition:
          allOf:
          - $ref: '#/components/schemas/AcquisitionSummary'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - acquisition
      - created_at
      - id
      - name
      - parameters
      - status
      - total_price
      - updated_at
