  /api/v1/core/entity-views/:
    get:
      operationId: v1_core_entity_views_list
      description: |-
        Owner-scoped CRUD + bulk reorder for saved entity views (016).

        Collections are small by design (tens of views per table), so list
        responses are plain arrays — no pagination envelope.
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntityView'
          description: ''
    post:
      operationId: v1_core_entity_views_create
      description: |-
        Owner-scoped CRUD + bulk reorder for saved entity views (016).

        Collections are small by design (tens of views per table), so list
        responses are plain arrays — no pagination envelope.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityView'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EntityView'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EntityView'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityView'
          description: ''
  /api/v1/core/entity-views/{id}/:
    get:
      operationId: v1_core_entity_views_retrieve
      description: |-
        Owner-scoped CRUD + bulk reorder for saved entity views (016).

        Collections are small by design (tens of views per table), so list
        responses are plain arrays — no pagination envelope.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityView'
          description: ''
    patch:
      operationId: v1_core_entity_views_partial_update
      description: |-
        Owner-scoped CRUD + bulk reorder for saved entity views (016).

        Collections are small by design (tens of views per table), so list
        responses are plain arrays — no pagination envelope.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEntityView'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEntityView'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEntityView'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityView'
          description: ''
    delete:
      operationId: v1_core_entity_views_destroy
      description: Reject deleting the default view — it is the guaranteed fallback
        (FR-003).
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/core/entity-views/reorder/:
    post:
      operationId: v1_core_entity_views_reorder_create
      description: |-
        Rewrite ``position`` for one table's views to match the given id order.

        Body: ``{"table_key": str, "ids": [str, ...]}``. Every id must exist,
        belong to the caller, and carry the given table_key; duplicates are
        rejected. Returns the table's views in their new order.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityView'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EntityView'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EntityView'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityView'
          description: ''
  /api/v1/finance/accounts/:
    get:
      operationId: v1_finance_accounts_list
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: Case-insensitive substring matched against any searchable attribute;
          combined with `filters` as AND.
        schema:
          type: string
      tags:
      - v1
      security:
      - cookieAuth: []
