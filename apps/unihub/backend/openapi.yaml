openapi: 3.0.3
info:
  title: unihub API
  version: 1.0.0
paths:
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/core/attribute-definitions/:
    get:
      operationId: v1_core_attribute_definitions_list
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttributeDefinition'
          description: ''
    post:
      operationId: v1_core_attribute_definitions_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttributeDefinition'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AttributeDefinition'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttributeDefinition'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeDefinition'
          description: ''
  /api/v1/core/attribute-definitions/{id}/:
    get:
      operationId: v1_core_attribute_definitions_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique value identifying this attribute definition.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeDefinition'
          description: ''
    patch:
      operationId: v1_core_attribute_definitions_partial_update
      description: 'Guard system definitions: only display_order/options may change
        (Principle I).'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique value identifying this attribute definition.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAttributeDefinition'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAttributeDefinition'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAttributeDefinition'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeDefinition'
          description: ''
    delete:
      operationId: v1_core_attribute_definitions_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique value identifying this attribute definition.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/core/attribute-values/:
    get:
      operationId: v1_core_attribute_values_retrieve
