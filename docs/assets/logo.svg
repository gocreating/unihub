<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- UniHub logo: hub/spoke motif — central node connected to 6 domain nodes -->
  <!-- Center hub -->
  <circle cx="40" cy="40" r="7" fill="#1677FF"/>
  <!-- Spokes (6 at 60° intervals) -->
  <line x1="40" y1="40" x2="65" y2="40" stroke="#1677FF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="40" y1="40" x2="52.5" y2="18.4" stroke="#1677FF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="40" y1="40" x2="27.5" y2="18.4" stroke="#1677FF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="40" y1="40" x2="15" y2="40" stroke="#1677FF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="40" y1="40" x2="27.5" y2="61.6" stroke="#1677FF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="40" y1="40" x2="52.5" y2="61.6" stroke="#1677FF" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Domain nodes -->
  <circle cx="65" cy="40" r="4" fill="#1677FF"/>
  <circle cx="52.5" cy="18.4" r="4" fill="#1677FF"/>
  <circle cx="27.5" cy="18.4" r="4" fill="#1677FF"/>
  <circle cx="15" cy="40" r="4" fill="#1677FF"/>
  <circle cx="27.5" cy="61.6" r="4" fill="#1677FF"/>
  <circle cx="52.5" cy="61.6" r="4" fill="#1677FF"/>
</svg>
