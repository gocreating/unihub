# Local dev compose for unihub.
#
# Builds all services from source. Suitable for running the full stack locally.
# The backend serves all domain apps (finance, visiting) from one Django project.
#
# Run from repo root:
#   docker compose -f apps/unihub/docker-compose.local.yml up -d

name: unihub

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: unihub
      POSTGRES_PASSWORD: unihub
      POSTGRES_DB: unihub
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unihub"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    build:
      context: ./backend
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    environment:
      DATABASE_URL: postgresql://unihub:unihub@db:5432/unihub
      DJANGO_SECRET_KEY: change-me-in-production
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      CORS_ALLOWED_ORIGINS: "http://localhost:3001"
      CSRF_TRUSTED_ORIGINS: "http://localhost:3001,http://localhost:8001"
      LOG_LEVEL: "INFO"
      # Auto-creates a superuser on first boot if none exists.
      # Change these before deploying to production.
      DJANGO_SUPERUSER_USERNAME: root
      DJANGO_SUPERUSER_PASSWORD: root
      DJANGO_SUPERUSER_EMAIL: ""

  frontend:
    build:
      context: ./frontend
    ports:
      - "3001:80"
    environment:
      BACKEND_URL: "http://backend:8001"
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  db-data:

networks:
  default:
    driver: bridge
