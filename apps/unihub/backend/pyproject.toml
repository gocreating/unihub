[project]
name = "unihub-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1",
    "djangorestframework>=3.15",
    "drf-spectacular>=0.28",
    "django-cors-headers>=4.6",
    "psycopg[binary]>=3.2",
    "dj-database-url>=2.3",
    "whitenoise[brotli]>=6.8",
    "gunicorn>=23.0",
    "nanoid>=2.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "unihub.settings_test"

[tool.ruff]
line-length = 100
