name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Create release on version bump
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get current version
        id: cur
        run: |
          VER=$(grep '^version' apps/unihub/backend/pyproject.toml | cut -d'"' -f2)
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - name: Get previous version
        id: prev
        run: |
          PREV=$(git show HEAD~1:apps/unihub/backend/pyproject.toml 2>/dev/null \
            | grep '^version' | cut -d'"' -f2 || echo "")
          echo "ver=$PREV" >> "$GITHUB_OUTPUT"

      - name: Detect version bump
        id: bump
        run: |
          CUR="${{ steps.cur.outputs.ver }}"
          PREV="${{ steps.prev.outputs.ver }}"
          if [ "$CUR" != "$PREV" ] && [ -n "$CUR" ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "Version bumped: $PREV → $CUR"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "No version bump detected (current: $CUR)"
          fi

      - name: Format display tag
        id: tag
        if: steps.bump.outputs.bumped == 'true'
        run: |
          RAW="${{ steps.cur.outputs.ver }}"
          IFS='.' read -r YYYY M D N <<< "$RAW"
          TAG="v$(printf '%s.%02d.%02d.%s' "$YYYY" "$M" "$D" "$N")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Display tag: $TAG"

      - name: Create GitHub release
        if: steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes
