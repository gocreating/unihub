name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    name: Create release on version bump
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get current version
        id: cur
        run: |
          VER=$(grep '^version' apps/unihub/backend/pyproject.toml | cut -d'"' -f2)
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - name: Get previous version
        id: prev
        if: github.event_name == 'push'
        run: |
          PREV=$(git show HEAD~1:apps/unihub/backend/pyproject.toml 2>/dev/null \
            | grep '^version' | cut -d'"' -f2 || echo "")
          echo "ver=$PREV" >> "$GITHUB_OUTPUT"

      - name: Detect version bump
        id: bump
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — skipping bump detection"
          else
            CUR="${{ steps.cur.outputs.ver }}"
            PREV="${{ steps.prev.outputs.ver }}"
            if [ "$CUR" != "$PREV" ] && [ -n "$CUR" ]; then
              echo "bumped=true" >> "$GITHUB_OUTPUT"
              echo "Version bumped: $PREV → $CUR"
            else
              echo "bumped=false" >> "$GITHUB_OUTPUT"
              echo "No version bump detected (current: $CUR)"
            fi
          fi

      - name: Format display tag
        id: tag
        if: steps.bump.outputs.bumped == 'true'
        run: |
          RAW="${{ steps.cur.outputs.ver }}"
          IFS='.' read -r YYYY M D N <<< "$RAW"
          BASE="v$(printf '%s.%02d.%02d.%s' "$YYYY" "$M" "$D" "$N")"
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=$BASE" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${BASE}-rc-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if [ "${{ steps.tag.outputs.prerelease }}" = "true" ]; then
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --prerelease
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes
          fi
