components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 200
        currency:
          type: string
          maxLength: 3
        color:
          type: string
          maxLength: 25
        open_datetime:
          type: string
          format: date-time
        close_datetime:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - currency
      - id
      - name
      - open_datetime
      - updated_at
    Asset:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 255
        category:
          type: string
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - updated_at
    AttributeDefinition:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        content_type:
          type: integer
        content_type_label:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 200
        data_type:
          $ref: '#/components/schemas/DataTypeEnum'
        is_system:
          type: boolean
          readOnly: true
        display_order:
          type: integer
          maximum: 2147483647
          minimum: 0
        options: {}
      required:
      - content_type
      - content_type_label
      - data_type
      - id
      - is_system
      - name
    BalanceSheet:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        date:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - date
      - id
      - updated_at
    Currency:
      type: object
      properties:
        code:
          type: string
          maxLength: 3
        name:
          type: string
          maxLength: 100
        symbol:
          type: string
          maxLength: 10
        is_base_currency:
          type: boolean
      required:
      - code
      - name
    DataTypeEnum:
      enum:
      - text
      - long_text
      - number
      - date
      - boolean
      - single_select
      type: string
      description: |-
        * `text` - Text
        * `long_text` - Long Text
        * `number` - Number
        * `date` - Date
        * `boolean` - Boolean
        * `single_select` - Single Select
    ExchangeRate:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        base_currency:
          type: string
          maxLength: 3
        quote_currency:
          type: string
          maxLength: 3
        rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,8})?$
        date:
          type: string
          format: date-time
      required:
      - base_currency
      - date
      - id
      - quote_currency
      - rate
