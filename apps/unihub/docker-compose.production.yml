# Production compose for unihub.
#
# Uses pre-built images referenced by environment variables.
# All secrets must be supplied via apps/unihub/.env before running.
#
# Build images from repo root:
#   docker build -t unihub-backend:latest apps/unihub/backend
#   docker build -t unihub-frontend:latest apps/unihub/frontend
#
# Run from repo root:
#   docker compose -f apps/unihub/docker-compose.production.yml up -d

name: unihub

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: unihub
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    image: ${BACKEND_IMAGE:-unihub-backend:latest}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/unihub
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  frontend:
    image: ${FRONTEND_IMAGE:-unihub-frontend:latest}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      BACKEND_URL: "http://backend:8000"
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  db-data:

networks:
  default:
    driver: bridge
