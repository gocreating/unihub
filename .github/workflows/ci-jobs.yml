name: CI Jobs

on:
  workflow_call:

jobs:
  frontend-ci:
    name: Frontend — lint / typecheck / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/unihub/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test --run

  backend-ci:
    name: Backend — ruff / pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/unihub/backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: unihub_test
          POSTGRES_USER: unihub
          POSTGRES_PASSWORD: unihub
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://unihub:unihub@localhost:5432/unihub_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Configure git identity for tests
        run: |
          git config --global user.email "ci@github.com"
          git config --global user.name "CI"

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest
